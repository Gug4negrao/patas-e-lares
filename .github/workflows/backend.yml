name: Backend (imagem Docker)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem em minúsculas
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/patas-e-lares-api" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avisar o Render
        env:
          GANCHO: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$GANCHO" ]; then
            curl -fsS -X POST "$GANCHO" > /dev/null && echo "Deploy no Render solicitado."
          else
            echo "RENDER_DEPLOY_HOOK não configurado; pulando."
          fi
